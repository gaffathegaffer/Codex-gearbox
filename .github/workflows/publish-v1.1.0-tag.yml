name: Publish Codex Gearbox v1.1.0 tag

on:
  push:
    branches:
      - transport/gearbox-v1.1.0-staging

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verified annotated tag
        shell: bash
        env:
          TARGET_SHA: 9f68fbb61a1b3116a1bcc39a3a33e833a8b2feef
          TAG_NAME: v1.1.0
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi
          git config user.name "Codex Gearbox Release"
          git config user.email "98050003+gaffathegaffer@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Codex Gearbox v1.1.0"
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$TARGET_SHA"
          git push origin "refs/tags/$TAG_NAME"
          peeled="$(git ls-remote --tags origin "refs/tags/$TAG_NAME^{}" | awk '{print $1}')"
          test "$peeled" = "$TARGET_SHA"
          echo "Published $TAG_NAME -> $TARGET_SHA"
